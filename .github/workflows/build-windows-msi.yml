name: Build Windows MSI

on:
  push:
    paths:
      - "phishguard/**"
      - "packaging/windows/**"
      - ".github/workflows/build-windows-msi.yml"
  workflow_dispatch:

jobs:
  msi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 msitools wixl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build MSI
        run: bash packaging/windows/build_msi.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhishGuard-Setup-msi
          path: release/PhishGuard-Setup.msi
