[project]
name = "phishguard"
version = "1.0.0"
description = "Local phishing URL detector for Microsoft and other major brands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[project.scripts]
phishguard = "phishguard.cli:main"
phishguard-desktop = "phishguard.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phishguard*"]

[tool.setuptools.package-data]
phishguard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
